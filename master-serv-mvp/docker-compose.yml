services:
  postgres:
    image: postgres:16
    container_name: master-serv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-master_serv}
      POSTGRES_USER: ${POSTGRES_USER:-master_serv_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - master_serv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-master_serv_dev} -d ${POSTGRES_DB:-master_serv}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    container_name: master-serv-clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - master_serv_clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  api:
    profiles: ["app"]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: master-serv-api
    restart: unless-stopped
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Defina DATABASE_URL_DOCKER no arquivo .env da raiz}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  master_serv_clamav_db:
  master_serv_pgdata:
