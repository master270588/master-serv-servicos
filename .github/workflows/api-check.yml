name: MASTER SERV API checks

on:
  push:
    branches: [main]
    paths:
      - "master-serv-mvp/apps/api/**"
      - "master-serv-mvp/database/**"
      - "master-serv-mvp/docker-compose.yml"
      - "master-serv-mvp/.env.example"
      - "master-serv-mvp/README.md"
      - ".github/workflows/api-check.yml"
  pull_request:
    paths:
      - "master-serv-mvp/apps/api/**"
      - "master-serv-mvp/database/**"
      - "master-serv-mvp/docker-compose.yml"
      - "master-serv-mvp/.env.example"
      - "master-serv-mvp/README.md"
      - ".github/workflows/api-check.yml"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master-serv-mvp/apps/api
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/master_serv_ci?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-value-not-for-production-123456789
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci
      - name: Report dependency security advisories
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a=require('./npm-audit-report.json'); const v=a.vulnerabilities||{}; console.log(JSON.stringify({summary:a.metadata?.vulnerabilities, packages:Object.entries(v).map(([name,item])=>({name,severity:item.severity,fixAvailable:item.fixAvailable,advisories:(item.via||[]).map(x=>typeof x==='string'?x:x.title)}))},null,2))"
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e "const a=require('./npm-audit-production.json'); const v=a.vulnerabilities||{}; console.log('PRODUCTION DEPENDENCIES:', JSON.stringify({summary:a.metadata?.vulnerabilities, packages:Object.entries(v).map(([name,item])=>({name,severity:item.severity,fixAvailable:item.fixAvailable,advisories:(item.via||[]).map(x=>typeof x==='string'?x:x.title)}))},null,2))"
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Run unit tests
        run: npm test -- --runInBand
      - name: Type-check document scanner worker
        run: npx tsc --noEmit --skipLibCheck --target ES2021 --module commonjs --moduleResolution node scripts/scan-pending-documents.ts
      - name: Build API
        run: npm run build
      - name: Build production Docker image
        run: docker build --tag master-serv-api-ci .
